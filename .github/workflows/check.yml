name: Correctness

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**/*.md']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15.0'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27.0.0+35'
      - name: Cross-language correctness
        run: python tools/check.py
      - name: End-to-end smoke harness and HTML rendering
        run: python tools/benchmarks.py --smoke --delete-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-smoke
          path: results/latest
          retention-days: 7
